name: Apartment website
on:
  push:
    branches: [master, 'codex/**']
    paths: ['mount-buller/**', '.github/workflows/apartment.yml']
  pull_request:
    paths: ['mount-buller/**', '.github/workflows/apartment.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mount-buller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mount-buller/package-lock.json
      - run: npm ci
      - run: npm run build
